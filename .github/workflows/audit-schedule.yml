name: Weekly Contribution Gap & Eligibility Audit

on:
  schedule:
    # 09:00 AM BST (UTC+6) every Monday = 03:00 AM UTC on Mondays
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allows manual trigger on-demand from GitHub UI

permissions:
  contents: read

jobs:
  audit:
    name: Run Weekly Contribution & Eligibility Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Contribution Audit & Generate Summary Report
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: node src/cli/generate-report.js

    - name: Upload Audit Report Artifact
      uses: actions/upload-artifact@v4
      with:
        name: weekly-contribution-audit-report
        path: AUDIT_REPORT.md
        retention-days: 90
