name: Weekly Contribution Gap & Eligibility Audit

on:
  schedule:
    # 09:00 AM BST (UTC+6) every Monday = 03:00 AM UTC on Mondays
    - cron: '0 3 * * 1'
  workflow_dispatch: # Allows manual trigger on-demand from GitHub UI

permissions:
  contents: write

jobs:
  audit:
    name: Run Weekly Contribution & Eligibility Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Contribution Audit with Automatic Retry
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for i in 1 2 3; do
          echo "Running contribution audit attempt $i..."
          node src/cli/generate-report.js && break || {
            echo "Audit attempt $i encountered recoverable error. Retrying in 5s..."
            sleep 5
          }
        done

    - name: Upload Audit Report Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: weekly-contribution-audit-history
        path: |
          AUDIT_REPORT.md
          audits/
        retention-days: 90

    - name: Commit and Push Updated Audit Records
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add AUDIT_REPORT.md audits/
        git diff --staged --quiet || git commit -m "chore(audit): update weekly contribution audit report [skip ci]"
        git push origin main || echo "Push skipped or branch up-to-date."
